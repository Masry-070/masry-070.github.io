<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacteer Mij - Youssef Salama</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100" style="background-color: #343a40 !important;">

  <header class="bg-secondary text-white py-4 border-bottom border-secondary text-center" style="background-color: #212529 !important;">
    <div class="container-fluid position-relative">
      <a href="index.html" class="btn btn-secondary position-md-absolute start-0 top-50 translate-middle-y-md ms-md-4 mb-3 mb-md-0 px-4" style="background-color: #6c757d; border: none;">Home</a>
      
      <h1 class="display-5 fw-bold mb-1" style="text-shadow: 0 0 15px rgba(255,255,255,0.6);">Contacteer Mij</h1>
      <p class="small mb-0 text-white-50 fst-italic">Heb je een vraag? Neem gerust contact op</p>
    </div>
  </header>

  <main class="container-fluid px-5 py-5 flex-grow-1 d-flex align-items-center">
    <div class="row row-cols-1 row-cols-md-2 g-5 w-100 mx-auto justify-content-center">
      
      <div class="col d-flex">
        <article class="card bg-secondary text-white text-center w-100 p-5 border-0 d-flex flex-column justify-content-center" 
                 style="background-color: #2b3035 !important; border-radius: 15px; box-shadow: 0 0 25px rgba(255, 255, 255, 0.15) !important; min-height: 400px;">
          <h2 class="card-title h2 fw-bold mb-4">Mijn persoonlijke Informatie</h2>
          <p class="fs-5 mb-2 fw-semibold">Masry</p>
          <p class="fs-5 mb-2">masryslm@gmail.com</p>
          <p class="fs-5 mb-0">06-43239283</p>
        </article>
      </div>

      <div class="col d-flex">
        <article class="card bg-secondary text-white w-100 p-5 border-0 d-flex flex-column justify-content-center" 
                 style="background-color: #2b3035 !important; border-radius: 15px; box-shadow: 0 0 25px rgba(255, 255, 255, 0.15) !important; min-height: 400px;">
          <h2 class="card-title h2 fw-bold mb-4 text-center">Gebruik de Contact Form</h2>
          
          <form action="#" method="POST">
            <div class="row mb-3 align-items-center">
              <label for="voornaam" class="col-sm-4 col-form-label fw-semibold">Voornaam</label>
              <div class="col-sm-8">
                <input type="text" class="form-control form-control-sm rounded-1" id="voornaam" placeholder="Johan">
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <label for="achternaam" class="col-sm-4 col-form-label fw-semibold">Achternaam</label>
              <div class="col-sm-8">
                <input type="text" class="form-control form-control-sm rounded-1" id="achternaam" placeholder="Pieter">
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <label for="datum" class="col-sm-4 col-form-label fw-semibold">Datum</label>
              <div class="col-sm-8">
                <input type="date" class="form-control form-control-sm rounded-1" id="datum">
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <label for="email" class="col-sm-4 col-form-label fw-semibold">E-mail</label>
              <div class="col-sm-8">
                <input type="email" class="form-control form-control-sm rounded-1" id="email" placeholder="JohanP@gmail.com">
              </div>
            </div>

            <div class="row mb-2 align-items-center">
              <label for="vraag" class="col-sm-4 col-form-label fw-semibold">Vraag</label>
              <div class="col-sm-8">
                <input type="text" class="form-control form-control-sm rounded-1" id="vraag" placeholder="Ik wil weten over....">
              </div>
            </div>
          </form>
        </article>
      </div>

    </div>
  </main>

  <footer class="bg-secondary text-white text-center py-4 border-top border-secondary mt-auto" style="background-color: #212529 !important;">
    <div class="container-fluid">
      <p class="mb-0 fw-bold">© M A S R Y ©</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
